<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ScanPNL</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#25303b;background:#e4e8ed}
    *{box-sizing:border-box}body{margin:0;width:376px;font-size:13px;background:linear-gradient(145deg,#fff 0%,#f1f3f6 48%,#dce1e7 100%)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #455972;outline-offset:3px}
    main{padding:20px}.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px}.settings{width:30px;height:30px;display:grid;place-items:center;border:1px solid #bdc6d1;border-radius:8px;background:linear-gradient(#fff,#e2e6ec);color:#586472;font-size:17px}.brand{flex:1}.brand small{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;color:#85909e;margin-bottom:3px}.brand strong{font-size:18px;font-weight:700;letter-spacing:-.5px}.monogram{width:36px;height:36px;display:grid;place-items:center}.monogram img{display:block;width:36px;height:36px;object-fit:contain}
    .power{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid #c8d0da;border-radius:10px;background:#ffffff91;box-shadow:inset 0 1px 0 #fff}.power strong{display:block;font-size:12px;font-weight:650}.power p{margin:4px 0 0;font-size:10px;color:#788392}.switch{position:relative;width:42px;height:24px;flex-shrink:0}.switch input{position:absolute;inset:0;margin:0;opacity:0;z-index:2;cursor:pointer;width:100%;height:100%}.slider{position:absolute;inset:0;border-radius:999px;background:#c9d0d9;box-shadow:inset 0 1px 3px #6c768333}.slider:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s}.switch input:checked+.slider{background:linear-gradient(110deg,#788899,#3e4d60)}.switch input:checked+.slider:after{transform:translateX(18px)}.switch input:focus-visible+.slider{outline:2px solid #455972;outline-offset:3px}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:23px 0 9px}.section-title h1{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:0;color:#758191}.section-title span{font-size:10px;color:#929caa}
    .platforms{display:flex;flex-direction:column;border:1px solid #c5ced9;border-radius:11px;overflow:hidden;background:#ffffff94}.platform{display:flex;align-items:center;gap:12px;min-height:47px;padding:9px 12px;text-align:left;border:0;border-bottom:1px solid #d7dde5;background:transparent;color:#374251;width:100%}.platform:last-child{border-bottom:0}.platform:hover{background:#fff}.platform img{width:26px;height:26px;border-radius:7px;object-fit:contain;background:#536071;padding:3px}.platform strong{font-size:12px;font-weight:600;flex:1}.platform .arrow{color:#8b97a6;font-size:15px}.platform:disabled{opacity:.45;cursor:not-allowed}.platform:disabled:hover{background:transparent}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.dashboard{display:inline-flex;align-items:center;gap:6px;border:1px solid #b5bfcc;border-radius:7px;padding:8px 11px;background:linear-gradient(#fff,#e0e6ed);color:#465365;font-size:11px;font-weight:650}.dashboard:hover{background:#fff}.status{font-size:9px;color:#7b8796;line-height:1.4;max-width:145px;text-align:right;margin:0}
    @media(prefers-reduced-motion:reduce){.slider:after{transition:none}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="trade-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
